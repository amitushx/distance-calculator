<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Video</title>
<style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; }
    #shuffle {
        position: fixed;
        top: 8px;
        right: 8px;
        padding: 6px 8px;
        border: none;
        border-radius: 8px;
        background: rgba(0, 0, 0, .6);
        color: #fff;
        font-size: 16px;
        cursor: pointer;
        opacity: 0;
        transition: opacity .15s;
    }
    body:hover #shuffle { opacity: 1; }
</style>
</head>
<body>
<div id="player"></div>
<button id="shuffle" type="button">🔀</button>

<script>
/*
 * Muted random 10-hour video, shown inside the calculator's
 * Picture-in-Picture window. It lives on its own page so YouTube receives
 * a referrer from this site; without one it refuses to play (error 153).
 */
const VIDEOS = [
    'jIQ6UV2onyI', // Nyan Cat
    'sVYlkLauPlY', // Peanut Butter Jelly Time
    'Sagg08DrO5U', // Gandalf Sax Guy
    '6iFbuIpe68k', // Epic Sax Guy
    'TJL4Y3aGPuA', // Trololo
    'TJ5XsyPOv0o', // Crumb cat dancing to Wii Shop music
    '0sTGxJ7rp9w', // catJAM
    'pxw-5qfJ1dk', // Shreksophone
    'rRPQs_kM_nw', // Dancing Polish Cow
    'f7CFjkr7g7o', // Coffin Dance
    'CdEpmU9pRaE', // Keyboard Cat
    'oPLObjVAvIU', // Rickroll
    'sVJDc-iJtSQ', // Baby Groot dancing
    'BTodGJB1ckA', // ｄａｎｃｉｎ
    '0aBkyfz9anQ'  // He-Man HEYYEYAAEYAAAEYAEYAA
];

const lang = new URLSearchParams(location.search).get('lang') === 'en' ? 'en' : 'he';
document.getElementById('shuffle').title = lang === 'en' ? 'Another video' : 'סרטון אחר';

function randomVideo(except) {
    const pool = VIDEOS.filter(id => id !== except);
    return pool[Math.floor(Math.random() * pool.length)];
}

let player = null;
let currentId = randomVideo();
let failures = 0;

function play(id) {
    currentId = id;
    player.loadVideoById(id);
    player.mute();
}

document.getElementById('shuffle').addEventListener('click', () => {
    if (player) play(randomVideo(currentId));
});

// Called by the YouTube IFrame API once it has loaded
function onYouTubeIframeAPIReady() {
    player = new YT.Player('player', {
        videoId: currentId,
        playerVars: { autoplay: 1, mute: 1, controls: 0, disablekb: 1, rel: 0, playsinline: 1, origin: location.origin },
        events: {
            onReady: e => { e.target.mute(); e.target.playVideo(); },
            onStateChange: e => {
                if (e.data === YT.PlayerState.PLAYING) failures = 0;
                if (e.data === YT.PlayerState.ENDED) e.target.seekTo(0);
            },
            // Embedding disabled or video removed: skip to another one,
            // but stop if every video fails (e.g. YouTube blocked)
            onError: () => { if (++failures < VIDEOS.length) play(randomVideo(currentId)); }
        }
    });
}
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
