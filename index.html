<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מחשבון מרחק</title>
<script>
    // Apply a saved theme before first paint to avoid a flash
    try {
        const theme = localStorage.getItem('theme');
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
    } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #fff0f6;
        --dots: #ffd3e6;
        --card: #ffffff;
        --text: #4a2537;
        --muted: #a8607f;
        --line: #f8d2e3;
        --accent: #d63a76;
        --accent-soft: #ffe4ef;
        --shadow: 0 14px 40px rgba(214, 58, 118, .16);
        --radius: 26px;
        --heart: ' ♡';
        --scheme: light;
    }
    @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
            --bg: #111111;
            --dots: transparent;
            --card: #1b1b1b;
            --text: #ececea;
            --muted: #85857f;
            --line: #2d2d2b;
            --accent: #2dd4bf;
            --accent-soft: #15302c;
            --shadow: none;
            --radius: 20px;
            --heart: '';
        --scheme: dark;
        }
    }
    :root[data-theme="dark"] {
        --bg: #111111;
        --dots: transparent;
        --card: #1b1b1b;
        --text: #ececea;
        --muted: #85857f;
        --line: #2d2d2b;
        --accent: #2dd4bf;
        --accent-soft: #15302c;
        --shadow: none;
        --radius: 20px;
        --heart: '';
        --scheme: dark;
    }

    * { box-sizing: border-box; margin: 0; }

    body {
        min-height: 100vh;
        display: grid;
        grid-template-rows: 1fr auto;
        gap: 16px;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        background-image: radial-gradient(var(--dots) 1.5px, transparent 1.5px);
        background-size: 22px 22px;
        color: var(--text);
        font-family: Rubik, system-ui, sans-serif;
    }

    main {
        width: 100%;
        max-width: 380px;
        padding: 28px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
    }
    h1 { font-size: 15px; font-weight: 500; color: var(--muted); }
    h1::after { content: var(--heart); color: var(--accent); }
    #lang {
        border: none;
        background: none;
        color: var(--muted);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
    }
    #lang:hover { color: var(--text); }
    .actions { position: relative; display: flex; align-items: center; gap: 14px; }
    #widgetsBtn, #theme {
        padding: 0;
        border: none;
        background: none;
        font-size: 15px;
        cursor: pointer;
        opacity: .5;
        filter: grayscale(1);
        transition: opacity .15s, filter .15s;
    }
    #widgetsBtn:hover, #widgetsBtn[aria-expanded="true"], #theme:hover { opacity: 1; filter: none; }

    #widgetMenu {
        position: absolute;
        top: calc(100% + 10px);
        inset-inline-end: 0;
        z-index: 1000;
        display: grid;
        gap: 12px;
        padding: 14px 16px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        white-space: nowrap;
    }
    #widgetMenu[hidden] { display: none; }

    .field {
        display: flex;
        align-items: baseline;
        gap: 8px;
        padding-bottom: 6px;
        border-bottom: 2px solid var(--line);
        transition: border-color .15s;
    }
    .field:focus-within { border-color: var(--accent); }
    .field input {
        flex: 1;
        min-width: 0;
        border: none;
        background: none;
        outline: none;
        color: var(--text);
        font: inherit;
        font-variant-numeric: tabular-nums;
        -moz-appearance: textfield;
    }
    .field input::-webkit-outer-spin-button,
    .field input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .field input::placeholder { color: var(--line); }
    .field span { color: var(--muted); font-size: 14px; white-space: nowrap; }

    #distanceField input { font-size: 44px; font-weight: 500; }

    .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 20px;
    }
    #bonusField { width: 120px; }
    #bonusField input { font-size: 18px; }

    .switch {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        cursor: pointer;
        user-select: none;
    }
    .switch input { position: absolute; opacity: 0; pointer-events: none; }
    .track {
        position: relative;
        width: 38px;
        height: 22px;
        border-radius: 11px;
        background: var(--line);
        transition: background .15s;
    }
    .track::after {
        content: '';
        position: absolute;
        top: 3px;
        inset-inline-start: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: var(--card);
        transition: transform .15s;
    }
    .switch input:checked + .track { background: var(--accent); }
    .switch input:checked + .track::after { transform: translateX(16px); }
    [dir="rtl"] .switch input:checked + .track::after { transform: translateX(-16px); }
    .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }

    #result {
        display: block;
        width: 100%;
        margin-top: 28px;
        padding: 22px 0 18px;
        border: none;
        border-radius: 14px;
        background: var(--accent-soft);
        color: var(--accent);
        font: inherit;
        cursor: pointer;
        transition: transform .08s;
    }
    #result:active { transform: scale(.98); }
    #result:disabled { cursor: default; color: var(--muted); background: var(--bg); }
    #amount {
        display: block;
        font-size: 56px;
        font-weight: 700;
        line-height: 1;
        font-variant-numeric: tabular-nums;
    }
    #amount small { font-size: .5em; font-weight: 500; margin-inline-end: 4px; }
    #caption { display: block; margin-top: 10px; font-size: 13px; opacity: .8; }

    footer { font-size: 12px; color: var(--muted); }

    .widget {
        position: fixed;
        top: 0;
        left: 0;
        padding: 6px 12px 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 14px;
        box-shadow: var(--shadow);
        touch-action: none;
        user-select: none;
        cursor: grab;
    }
    .widget.dragging { cursor: grabbing; }
    .widget-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 11px;
        color: var(--muted);
    }
    .widget button {
        padding: 0;
        border: none;
        background: none;
        color: var(--muted);
        font: inherit;
        cursor: pointer;
    }
    .widget button:hover { color: var(--text); }
    .widget .close { font-size: 16px; line-height: 1; }
    .widget input, .widget textarea {
        border: none;
        background: none;
        outline: none;
        color: var(--text);
        font: inherit;
    }
    .widget-big {
        font-size: 26px;
        font-weight: 500;
        line-height: 1.2;
        font-variant-numeric: tabular-nums;
    }
    .widget-small { font-size: 12px; color: var(--muted); }
    #alarms {
        display: grid;
        grid-template-columns: auto auto auto;
        align-items: center;
        gap: 2px 12px;
    }
    .alarm-row { display: contents; }
    .alarm-row span { font-size: 13px; color: var(--muted); }
    .alarm-row.ringing span { color: var(--accent); font-weight: 500; }
    .alarm-row input[type="time"] {
        font-size: 20px;
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        color-scheme: var(--scheme);
    }
    #w-note { background: var(--accent-soft); }
    #noteText {
        display: block;
        width: 180px;
        height: 110px;
        min-width: 120px;
        min-height: 50px;
        margin-top: 4px;
        resize: both;
        font-size: 14px;
        line-height: 1.4;
        touch-action: auto;
        user-select: text;
        cursor: text;
    }
    #noteText::placeholder { color: var(--muted); opacity: .6; }
    .widget .stop {
        display: none;
        width: 100%;
        margin-top: 8px;
        padding: 6px;
        border-radius: 8px;
        background: var(--accent);
        color: var(--card);
        font-weight: 500;
    }
    .widget .stop:hover { color: var(--card); }
    .widget.ringing .stop { display: block; }
    .widget.ringing { border-color: var(--accent); animation: ring 1s infinite; }
    @keyframes ring { 50% { background: var(--accent-soft); } }

    kbd {
        padding: 1px 5px;
        border: 1px solid currentColor;
        border-radius: 4px;
        font: inherit;
        font-size: 11px;
        opacity: .7;
    }
</style>
</head>
<body>
<main>
    <header>
        <h1 id="title"></h1>
        <div class="actions">
            <button id="widgetsBtn" type="button" aria-expanded="false">🧩</button>
            <button id="theme" type="button"></button>
            <button id="lang" type="button"></button>
            <div id="widgetMenu" hidden>
                <label class="switch"><input type="checkbox" data-widget="clock"><span class="track"></span><span data-t="clock"></span></label>
                <label class="switch"><input type="checkbox" data-widget="alarm"><span class="track"></span><span data-t="alarm"></span></label>
                <label class="switch"><input type="checkbox" data-widget="note"><span class="track"></span><span data-t="note"></span></label>
            </div>
        </div>
    </header>

    <label class="field" id="distanceField">
        <input id="distance" type="number" inputmode="numeric" min="0" placeholder="0" autofocus autocomplete="off">
        <span id="metersLabel"></span>
    </label>

    <div class="row">
        <label class="field" id="bonusField">
            <input id="bonus" type="number" inputmode="decimal" min="0" placeholder="0" autocomplete="off">
            <span id="bonusLabel"></span>
        </label>
        <label class="switch">
            <input id="walker" type="checkbox">
            <span class="track"></span>
            <span id="walkerLabel"></span>
            <kbd>W</kbd>
        </label>
    </div>

    <button id="result" type="button" disabled>
        <span id="amount" dir="ltr">—</span>
        <span id="caption"></span>
    </button>
</main>
<footer id="credit"></footer>

<div class="widget" id="w-clock" hidden>
    <div class="widget-bar"><span data-t="clock"></span><button class="close" type="button">×</button></div>
    <div id="clockTime" class="widget-big" dir="ltr"></div>
    <div id="clockDate" class="widget-small"></div>
</div>
<div class="widget" id="w-alarm" hidden>
    <div class="widget-bar"><span data-t="alarm"></span><button class="close" type="button">×</button></div>
    <div id="alarms">
        <div class="alarm-row" data-alarm="long">
            <span data-t="alarmLong"></span>
            <input type="time" dir="ltr">
            <label class="switch"><input type="checkbox"><span class="track"></span></label>
        </div>
        <div class="alarm-row" data-alarm="short">
            <span data-t="alarmShort"></span>
            <input type="time" dir="ltr">
            <label class="switch"><input type="checkbox"><span class="track"></span></label>
        </div>
        <div class="alarm-row" data-alarm="end">
            <span data-t="alarmEnd"></span>
            <input type="time" dir="ltr">
            <label class="switch"><input type="checkbox"><span class="track"></span></label>
        </div>
    </div>
    <button class="stop" type="button" data-t="stop"></button>
</div>
<div class="widget" id="w-note" hidden>
    <div class="widget-bar"><span data-t="note"></span><button class="close" type="button">×</button></div>
    <textarea id="noteText" dir="auto"></textarea>
</div>

<script src="fees.js"></script>
<script>
const translations = {
    he: {
        title: 'מחשבון מרחק',
        meters: 'מטרים',
        bonus: '% בונוס',
        walker: 'ווקר',
        hint: '<kbd>Enter</kbd> או לחיצה להעתקה',
        copied: 'הועתק ✓',
        tooShort: 'מרחק מינימלי 10 מטר',
        copyFailed: 'לא ניתן להעתיק',
        lightMode: 'מצב בהיר',
        darkMode: 'מצב כהה',
        credit: 'נעשה עם ❤️ על ידי עמית כהן ו־Claude',
        widgets: 'ווידג׳טים',
        clock: 'שעון',
        alarm: 'שעון מעורר',
        alarmLong: 'ארוכה',
        alarmShort: 'קצרה',
        alarmEnd: 'ירידה',
        note: 'פתק',
        notePlaceholder: 'כתבו משהו…',
        close: 'סגירה',
        stop: 'עצירה',
        otherLang: 'English'
    },
    en: {
        title: 'Distance Calculator',
        meters: 'meters',
        bonus: '% bonus',
        walker: 'Walker',
        hint: '<kbd>Enter</kbd> or click to copy',
        copied: 'Copied ✓',
        tooShort: 'Minimum distance is 10 meters',
        copyFailed: 'Could not copy',
        lightMode: 'Light mode',
        darkMode: 'Dark mode',
        credit: 'Made with ❤️ by Amit Cohen and Claude',
        widgets: 'Widgets',
        clock: 'Clock',
        alarm: 'Alarms',
        alarmLong: 'Long',
        alarmShort: 'Short',
        alarmEnd: 'Ending',
        note: 'Note',
        notePlaceholder: 'Write something…',
        close: 'Close',
        stop: 'Stop',
        otherLang: 'עברית'
    }
};

const $ = id => document.getElementById(id);

// localStorage may be unavailable (private mode, blocked storage)
const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} }
};

let lang = store.get('lang') === 'en' ? 'en' : 'he';
let current = null;      // payment currently shown, or null if none
let captionTimer = null;

function applyLanguage() {
    const t = translations[lang];
    document.documentElement.lang = lang;
    document.documentElement.dir = lang === 'he' ? 'rtl' : 'ltr';
    document.title = t.title;
    $('title').textContent = t.title;
    $('lang').textContent = t.otherLang;
    $('metersLabel').textContent = t.meters;
    $('bonusLabel').textContent = t.bonus;
    $('walkerLabel').textContent = t.walker;
    $('credit').textContent = t.credit;
    translateWidgets();
    updateThemeButton();
    render();
}

// Theme: follows the system until the user picks one with the header button
const darkQuery = matchMedia('(prefers-color-scheme: dark)');
function isDark() {
    const theme = document.documentElement.dataset.theme;
    return theme ? theme === 'dark' : darkQuery.matches;
}
// The button shows the mode it switches to
function updateThemeButton() {
    $('theme').textContent = isDark() ? '☀️' : '🌙';
    $('theme').title = translations[lang][isDark() ? 'lightMode' : 'darkMode'];
}

// Recalculate and show the payment for the current inputs
function render() {
    const t = translations[lang];
    const raw = $('distance').value;
    const meters = Number(raw);
    const bonus = Math.max(Number($('bonus').value) || 0, 0);

    clearTimeout(captionTimer);
    if (raw === '' || !(meters >= 10)) {
        current = null;
        $('amount').textContent = '—';
        $('caption').textContent = raw === '' ? ' ' : t.tooShort;
    } else {
        current = payment(meters, bonus, $('walker').checked);
        $('amount').innerHTML = `<small>₪</small>${current}`;
        $('caption').innerHTML = t.hint;
    }
    $('result').disabled = current === null;
}

// Fallback for browsers without the async clipboard API
function legacyCopy(text) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok ? Promise.resolve() : Promise.reject();
}

// Copy the numeric amount only (no ₪ sign)
function copyAmount() {
    if (current === null) return;
    const t = translations[lang];
    const text = String(current);
    const write = navigator.clipboard
        ? navigator.clipboard.writeText(text).catch(() => legacyCopy(text))
        : legacyCopy(text);
    write.then(
        () => { $('caption').textContent = t.copied; },
        () => { $('caption').textContent = t.copyFailed; }
    ).finally(() => {
        clearTimeout(captionTimer);
        captionTimer = setTimeout(render, 1500);
    });
}

$('distance').addEventListener('input', render);
$('bonus').addEventListener('input', () => {
    store.set('bonus', $('bonus').value);
    render();
});
$('walker').addEventListener('change', render);
$('result').addEventListener('click', () => {
    copyAmount();
    $('distance').focus();
});
$('theme').addEventListener('click', () => {
    const theme = isDark() ? 'light' : 'dark';
    document.documentElement.dataset.theme = theme;
    store.set('theme', theme);
    updateThemeButton();
});
darkQuery.addEventListener('change', updateThemeButton);
$('lang').addEventListener('click', () => {
    lang = lang === 'he' ? 'en' : 'he';
    store.set('lang', lang);
    applyLanguage();
});

document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
        document.querySelectorAll('.widget.ringing').forEach(stopRinging);
        $('widgetMenu').hidden = true;
        $('widgetsBtn').setAttribute('aria-expanded', 'false');
    }
    // Let widgets (e.g. the note) take typing without triggering shortcuts
    if (e.target.closest('.widget, #widgetMenu')) return;
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'Enter') {
        e.preventDefault();
        copyAmount();
    } else if (e.code === 'KeyW') {   // physical key, works on Hebrew layout too
        e.preventDefault();
        $('walker').checked = !$('walker').checked;
        render();
    }
});

// Widgets: small draggable panels, all off by default. Which ones are on,
// where they sit and what they hold is remembered in localStorage.
const WIDGETS = ['clock', 'alarm', 'note'];
let widgets = {};
try { widgets = JSON.parse(store.get('widgets')) || {}; } catch {}
for (const name of WIDGETS) widgets[name] = { on: false, ...widgets[name] };
delete widgets.timer;   // removed widget
const saveWidgets = () => store.set('widgets', JSON.stringify(widgets));
const widgetEl = name => $(`w-${name}`);
const DEFAULT_Y = { clock: 16, alarm: 112, note: 300 };
let topZ = 10;

function translateWidgets() {
    const t = translations[lang];
    document.querySelectorAll('[data-t]').forEach(el => { el.textContent = t[el.dataset.t]; });
    document.querySelectorAll('.widget .close').forEach(el => { el.title = t.close; });
    $('widgetsBtn').title = t.widgets;
    $('noteText').placeholder = t.notePlaceholder;
}

// Position a widget, keeping it fully inside the window
function placeWidget(name, x, y) {
    const el = widgetEl(name);
    el.style.left = Math.max(0, Math.min(x, innerWidth - el.offsetWidth)) + 'px';
    el.style.top = Math.max(0, Math.min(y, innerHeight - el.offsetHeight)) + 'px';
}

function setWidget(name, on) {
    const w = widgets[name];
    const el = widgetEl(name);
    w.on = on;
    el.hidden = !on;
    $('widgetMenu').querySelector(`[data-widget="${name}"]`).checked = on;
    if (on) {
        el.style.zIndex = ++topZ;
        tick();
        // Default spot: stacked down the left edge
        placeWidget(name, w.x ?? 16, w.y ?? DEFAULT_Y[name]);
    } else {
        stopRinging(el);
    }
    saveWidgets();
}

for (const name of WIDGETS) {
    const el = widgetEl(name);
    el.addEventListener('pointerdown', e => {
        el.style.zIndex = ++topZ;
        if (e.button !== 0 || e.target.closest('input, textarea, button, label')) return;
        const dx = e.clientX - el.offsetLeft;
        const dy = e.clientY - el.offsetTop;
        const move = e => placeWidget(name, e.clientX - dx, e.clientY - dy);
        el.setPointerCapture(e.pointerId);
        el.classList.add('dragging');
        el.addEventListener('pointermove', move);
        el.addEventListener('lostpointercapture', () => {
            el.removeEventListener('pointermove', move);
            el.classList.remove('dragging');
            widgets[name].x = el.offsetLeft;
            widgets[name].y = el.offsetTop;
            saveWidgets();
        }, { once: true });
    });
    el.querySelector('.close').addEventListener('click', () => setWidget(name, false));
    el.querySelector('.stop')?.addEventListener('click', () => stopRinging(el));
}

// Pull widgets back on screen when the window shrinks, without
// forgetting where they were
addEventListener('resize', () => {
    for (const name of WIDGETS) {
        if (widgets[name].on) placeWidget(name, widgets[name].x ?? 16, widgets[name].y ?? DEFAULT_Y[name]);
    }
});

$('widgetsBtn').addEventListener('click', () => {
    const open = $('widgetMenu').hidden;
    $('widgetMenu').hidden = !open;
    $('widgetsBtn').setAttribute('aria-expanded', String(open));
});
document.addEventListener('pointerdown', e => {
    if (e.target.closest('#widgetMenu, #widgetsBtn')) return;
    $('widgetMenu').hidden = true;
    $('widgetsBtn').setAttribute('aria-expanded', 'false');
});
$('widgetMenu').addEventListener('change', e => setWidget(e.target.dataset.widget, e.target.checked));

// Ringing alarms: a beep every second until stopped, at most a minute.
// Browsers only allow sound after a user gesture, so the audio context is
// unlocked when an alarm is set, and on any later interaction.
let audio = null;
let beepTimer = null;
function unlockAudio() {
    try {
        audio ??= new AudioContext();
        audio.resume();
    } catch {}
}
function beep() {
    if (!audio) return;
    const t = audio.currentTime;
    for (let i = 0; i < 3; i++) {
        const osc = audio.createOscillator();
        const gain = audio.createGain();
        const at = t + i * 0.2;
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.3, at + 0.01);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.15);
        osc.connect(gain).connect(audio.destination);
        osc.start(at);
        osc.stop(at + 0.16);
    }
}
function startRinging(el) {
    el.classList.add('ringing');
    clearTimeout(el.ringTimeout);
    el.ringTimeout = setTimeout(() => stopRinging(el), 60000);
    if (!beepTimer) {
        beep();
        beepTimer = setInterval(beep, 1000);
    }
}
function stopRinging(el) {
    el.classList.remove('ringing');
    el.querySelectorAll('.ringing').forEach(row => row.classList.remove('ringing'));
    clearTimeout(el.ringTimeout);
    if (!document.querySelector('.widget.ringing')) {
        clearInterval(beepTimer);
        beepTimer = null;
    }
}
const ringable = () => widgets.alarm.on && Object.values(widgets.alarm.alarms).some(a => a.armed);
document.addEventListener('pointerdown', () => { if (ringable()) unlockAudio(); });
document.addEventListener('keydown', () => { if (ringable()) unlockAudio(); });

// Alarms for the reps' shift: long break, short break and end of shift
const alarm = widgets.alarm;   // alarms: { long, short, end } each with time ("HH:MM"), armed
alarm.alarms ??= {};
delete alarm.time;             // from the earlier single alarm
delete alarm.armed;
const lastAlarm = {};          // per alarm, date + time it last rang, so it rings once
document.querySelectorAll('.alarm-row').forEach(row => {
    const a = alarm.alarms[row.dataset.alarm] ??= {};
    const time = row.querySelector('input[type="time"]');
    const armed = row.querySelector('input[type="checkbox"]');
    time.value = a.time || '';
    armed.checked = !!a.armed;
    time.addEventListener('change', () => {
        a.time = time.value;
        a.armed = !!a.time;   // setting a time arms the alarm
        armed.checked = a.armed;
        if (a.armed) unlockAudio();
        saveWidgets();
    });
    armed.addEventListener('change', () => {
        a.armed = armed.checked;
        if (a.armed) unlockAudio();
        saveWidgets();
    });
});

// Sticky note
const note = $('noteText');
note.value = widgets.note.text || '';
if (widgets.note.w) {
    note.style.width = widgets.note.w + 'px';
    note.style.height = widgets.note.h + 'px';
}
note.addEventListener('input', () => {
    widgets.note.text = note.value;
    saveWidgets();
});
new ResizeObserver(() => {
    if (!note.offsetWidth) return;   // hidden
    widgets.note.w = note.offsetWidth;
    widgets.note.h = note.offsetHeight;
    saveWidgets();
}).observe(note);

// Update the clock and check the alarms
function tick() {
    const now = new Date();
    const pad = n => String(n).padStart(2, '0');
    const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
    if (widgets.clock.on) {
        $('clockTime').textContent = `${hm}:${pad(now.getSeconds())}`;
        $('clockDate').textContent = now.toLocaleDateString(lang === 'he' ? 'he-IL' : 'en-GB',
            { weekday: 'long', day: 'numeric', month: 'short' });
    }
    const today = now.toDateString() + hm;
    if (alarm.on) {
        document.querySelectorAll('.alarm-row').forEach(row => {
            const id = row.dataset.alarm;
            const a = alarm.alarms[id];
            if (!a.armed || a.time !== hm || lastAlarm[id] === today) return;
            lastAlarm[id] = today;
            row.classList.add('ringing');
            startRinging(widgetEl('alarm'));
        });
    }
}
setInterval(tick, 250);

for (const name of WIDGETS) if (widgets[name].on) setWidget(name, true);

$('bonus').value = store.get('bonus') || '';
applyLanguage();

// Keep the screen awake while the page is visible. The browser releases the
// lock when the tab is hidden, so re-request on visibility change; also retry
// on interaction in case the browser wanted a user gesture first.
let wakeLock = null;
let wakeLockPending = false;
async function requestWakeLock() {
    if (!('wakeLock' in navigator) || wakeLock || wakeLockPending) return;
    if (document.visibilityState !== 'visible') return;
    wakeLockPending = true;
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        wakeLock.addEventListener('release', () => { wakeLock = null; });
    } catch {
        // Denied (e.g. battery saver) - try again on the next interaction
    } finally {
        wakeLockPending = false;
    }
}
document.addEventListener('visibilitychange', requestWakeLock);
document.addEventListener('pointerdown', requestWakeLock);
document.addEventListener('keydown', requestWakeLock);
requestWakeLock();
</script>
