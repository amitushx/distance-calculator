<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Distance fee tests</title>
<style>
    body { font: 14px/1.6 system-ui, sans-serif; margin: 24px; }
    .pass { color: #15803d; }
    .fail { color: #b91c1c; font-weight: 600; }
</style>
</head>
<body>
<h1 id="summary"></h1>
<ol id="results"></ol>
<script src="../fees.js"></script>
<script>
// [meters, bonus %, walker, expected payment in ILS]
const CASES = [
    // Rider: 3 ILS up to 100m, then each started 100m adds its band's rate
    [0, 0, false, 3],
    [100, 0, false, 3],
    [101, 0, false, 4],                // 3.55 rounds up
    [200, 0, false, 4],
    [1000, 0, false, 8],               // 7.95
    [1001, 0, false, 9],               // 8.30, first 100m of the 0.35 band
    [3000, 0, false, 15],              // 14.95
    [3001, 0, false, 16],              // 15.25, first 100m of the 0.30 band
    [5000, 0, false, 21],              // 20.95
    [5001, 0, false, 22],              // 21.15, first 100m of the 0.20 band
    [10000, 0, false, 31],             // 30.95
    // Rider with bonus
    [100, 100, false, 6],              // exactly 6, not 7
    [1000, 10, false, 9],              // 8.745
    [3000, 20, false, 18],             // 17.94
    // Walker: 7 ILS up to 100m, +1 ILS per started 50m, capped at 16
    [0, 0, true, 7],
    [100, 0, true, 7],
    [101, 0, true, 8],
    [150, 0, true, 8],
    [151, 0, true, 9],
    [550, 0, true, 16],
    [551, 0, true, 16],                // cap
    [5000, 0, true, 16],
    // Walker with bonus
    [100, 50, true, 11],               // 10.50
    [150, 12.5, true, 9],              // exactly 9, fractional bonus
    [5000, 25, true, 20]               // bonus applies on top of the cap
];

const results = [];
for (const [meters, bonus, walker, expected] of CASES) {
    const got = payment(meters, bonus, walker);
    results.push({
        ok: got === expected,
        text: `${walker ? 'walker' : 'rider'}, ${meters}m, ${bonus}% bonus → ₪${got} (expected ₪${expected})`
    });
}

const failed = results.filter(r => !r.ok).length;
document.getElementById('summary').textContent = failed ? `${failed} of ${results.length} failed` : `All ${results.length} passed`;
document.getElementById('summary').className = failed ? 'fail' : 'pass';
for (const r of results) {
    const li = document.createElement('li');
    li.className = r.ok ? 'pass' : 'fail';
    li.textContent = r.text;
    document.getElementById('results').append(li);
}
</script>
</body>
</html>
